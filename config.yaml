data:
  input_json: monitor_outputs.json

ai:
  mode: multi_agent                 # Agent mode: 'single_agent' or 'multi_agent'
  selected_model: qwen3:8b          # Modelo local servido pelo Ollama
  scheduler_interval: 300           # Number of seconds between scheduler runs
  timestamp_lookback_seconds: 600   # Number of seconds to look back for metrics
  workloads_shard_size: 200         # DEPRECIATED
  fetch_metrics_immediately: false   # Whether to fetch metrics immediately or wait for the scheduler

  # Single Agent Configuration
  single_agent:
    selected_prompt: single_agent_v1
    provider: ollama
    generation_config:
      temperature: 0.1
      max_output_tokens: 18000

  # Multi-Agent Configuration
  multi_agent:
    selected_prompt: multi_agent
    provider: ollama
    generation_config:
      temperature: 0.1
      max_output_tokens: 18000
    # Vote system:
    agents:
      cpu_checker:
        enabled: true
        weight: 1.0
      memory_checker:
        enabled: true
        weight: 1.0
      pending_checker:
        enabled: true
        weight: 1.5 

  # Legacy default_config for backward compatibility
  default_config:
    provider: ollama
    generation_config:
      temperature: 0.1
      max_output_tokens: 18000

  models:
    qwen3:8b:
      model_name: qwen3:8b
      provider: ollama
      ollama_config:
        num_ctx: 8192          # Tamanho do contexto em tokens
        num_thread: 8          # Número de threads de CPU
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    llama3.1:8b:
      model_name: llama3.1:8b
      provider: ollama
      ollama_config:
        num_ctx: 8192
        num_thread: 8
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    gemma3:4b:
      model_name: gemma3:4b
      provider: ollama
      ollama_config:
        num_ctx: 8192
        num_thread: 8
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    # Modelos remotos (OpenRouter) mantidos para referência
    gemini:
      model_name: google/gemini-2.0-flash-001
      provider: openrouter
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    claude:
      model_name: anthropic/claude-3.5-sonnet
      provider: openrouter
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000
    gpt-4o:
      model_name: openai/gpt-4o
      provider: openrouter
      generation_config:
        temperature: 0.1
        max_output_tokens: 6000

  cluster_selection: # Configuration for selecting clusters to analyze
    listed_clusters: [] # List of specific cluster labels to include. Empty means all clusters.

paths:
  output_dir: ai-engine/data/output
  log_dir: ai-engine/logs

logging:
  level: DEBUG
  file: ai_engine.log

monitor:
  host: 0.0.0.0
  port: 8082
  interval: 600
  route: metrics

actuator:
  host: 0.0.0.0
  port: 8084
  route: apply

server:
  host: 0.0.0.0
  port: 8083
  reload: false

